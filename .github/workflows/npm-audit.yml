name: Dependency audit

on:
  schedule:
    # Every 2 hours. Moderate and low findings are stored on the 18:00 UTC run.
    # Each stored advisory is sent to Cursor once. Cursor opens a pull request with the fix.
    # The job fails when a new finding is sent or a send fails. Already-sent findings stay green.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test audit scripts
        run: node --test .github/scripts/audit-dependencies.test.mjs .github/scripts/send-audit-to-cursor.test.mjs

      - name: Audit dependencies
        run: node .github/scripts/audit-dependencies.mjs "$RUNNER_TEMP/audit-findings.json"

      - name: Send findings to Cursor
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: node .github/scripts/send-audit-to-cursor.mjs "$RUNNER_TEMP/audit-findings.json"
