name: Dependency audit

on:
  schedule:
    # Every 2 hours. Moderate and low findings are included at 18:00 UTC.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test audit scripts
        run: node --test .github/scripts/*.test.mjs

      - name: Audit dependencies
        run: node .github/scripts/audit-dependencies.mjs "$RUNNER_TEMP/audit-findings.json"

      - name: Notify Telegram and send to Cursor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          status=0
          node .github/scripts/notify-audit-telegram.mjs "$RUNNER_TEMP/audit-findings.json" || status=$?
          node .github/scripts/send-audit-to-cursor.mjs "$RUNNER_TEMP/audit-findings.json" || status=$?
          exit "$status"
